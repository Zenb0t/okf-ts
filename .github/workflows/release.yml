name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Caching is deliberately off: npm's trusted-publishing guidance asks for
      # an uncached dependency tree in release builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. Node 24 already ships an
      # 11.x line, but upgrade explicitly so a runner image change cannot
      # silently drop the job below the minimum.
      - run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - run: npm ci

      # No NODE_AUTH_TOKEN. GitHub mints a short-lived OIDC token that npm
      # verifies against the trusted publisher registered for this repository
      # and workflow filename, so no long-lived secret exists to leak.
      # prepublishOnly runs the full check suite and builds dist/ before packing.
      - run: npm publish
